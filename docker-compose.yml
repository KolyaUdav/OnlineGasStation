version: '3.8'
services:
  # Наш Laravel
  app:
    build:
      context: .
      dockerfile: ./docker/php.dockerfile
    volumes:
      - .:/var/www # Пробрасываем файлы из Windows в контейнер
    networks:
      - project-network

  # Наш веб-сервер Nginx
  nginx:
    image: nginx:alpine
    ports:
      - "80:80" # Будет доступен по адресу http://localhost
    volumes:
      - .:/var/www
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - project-network

  # Наш Go сервис
  
  gas-prices:
    build:
      context: ./go_services/gas_prices_service
      dockerfile: Dockerfile
    depends_on:
      - db
    networks:
      - project-network
    ports:
      - "8081:8081"

  promotions:
    build:
      context: ./go_services/promotions_service
      dockerfile: Dockerfile
    depends_on:
      - db
    networks:
      - project-network
    ports:
      - "8082:8082"

  # База данных MySQL
  db:
    image: mysql:8.0
    container_name: project_db
    restart: always
    environment:
      MYSQL_DATABASE: gas_station
      MYSQL_ROOT_PASSWORD: root
      MYSQL_USER: user
      MYSQL_PASSWORD: pswd
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - project-network
networks:
  project-network:
    driver: bridge
volumes:
  db_data:

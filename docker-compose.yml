services:
  # Наш Laravel
  app:
    build:
      context: .
      dockerfile: ./docker/php.dockerfile
    depends_on:
      - redis
    volumes:
      - .:/var/www # Пробрасываем файлы из Windows в контейнер
    networks:
      - project-network

  # Наш веб-сервер Nginx
  nginx:
    image: nginx:alpine
    ports:
      - "80:80" # Будет доступен по адресу http://localhost
    volumes:
      - .:/var/www
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - project-network

  # Наш Go сервис
  
  gas-prices:
    build:
      context: ./go_services/gas_prices_service
      dockerfile: ../Dockerfile.debug
    depends_on:
      - db
    networks:
      - project-network
    ports:
      - "8081:8081"
      - "40001:40001"
    security_opt:
      - "apparmor=unconfined"
      - "seccomp=unconfined"
    environment:
      - DLV_PORT=40001

  promotions:
    build:
      context: ./go_services/promotions_service
      dockerfile: ../Dockerfile.debug
    depends_on:
      - db
    networks:
      - project-network
    ports:
      - "8082:8082"
      - "40002:40002"
    security_opt:
      - "apparmor=unconfined"
      - "seccomp=unconfined"
    environment:
      - DLV_PORT=40002

  # База данных MySQL
  db:
    image: mysql:8.0
    container_name: project_db
    restart: always
    environment:
      MYSQL_DATABASE: gas_station
      MYSQL_ROOT_PASSWORD: root
      MYSQL_USER: user
      MYSQL_PASSWORD: pswd
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - project-network

  redis:
    image: redis:alpine
    ports:
      - "6379:6379"
    networks:
      - project-network

  horizon:
    build:
      context: .
      dockerfile: ./docker/php.dockerfile
    container_name: horizon
    restart: unless-stopped
    command: php artisan horizon
    volumes: 
      - .:/var/www
    depends_on:
      - redis
      - app
    networks:
      - project-network

  pdf-generator:
    image: ghcr.io/puppeteer/puppeteer:latest
    container_name: pdf_generator
    restart: unless-stopped
    command: node index.js
    working_dir: /app
    volumes:
      - ./node_services/pdf-generator:/app
    environment:
      - PORT=3000
    networks:
      - project-network

networks:
  project-network:
    driver: bridge
volumes:
  db_data:
